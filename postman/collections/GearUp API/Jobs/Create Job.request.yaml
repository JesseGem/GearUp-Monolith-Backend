$kind: http-request
order: 1000
method: POST
url: '{{base_url}}/jobs'

auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'

headers:
  - key: Content-Type
    value: application/json

body:
  type: json
  content: |-
    {
      "title": "Brake inspection",
      "description": "Check front and rear brakes",
      "vehicleId": "{{vehicleId}}",
      "estimatedCost": 850
    }
